<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم المفرق | Almafraa Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@300;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        /* أنماط CSS الأساسية (Styles) */
        body {
            margin: 0;
            font-family: 'Marhey', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            direction: rtl; 
        }

        /* رأس الصفحة والتنقل */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo {
            width: 40px; 
            height: 40px;
            background-color: #ffc107; 
            border-radius: 5px;
            margin-left: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            padding: 5px;
            text-align: center;
            line-height: 1;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            background: #fff;
            margin-bottom: 5px;
            border-radius: 1px;
            width: 30px;
        }
        
        /* القسم الرئيسي (البطل) */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding-bottom: 50px;
            position: relative;
        }

        /* الطبقة الداكنة فوق الصورة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* حاوية النص والزر */
        .content {
            z-index: 2;
            padding: 0 20px;
            margin-bottom: 100px;
        }

        /* العنوان الرئيسي (اسم المطعم) */
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-style: italic;
            font-weight: 700;
            line-height: 1.1;
            margin: 0 0 10px 0;
            color: #fff;
        }

        /* العبارة العربية */
        .tagline {
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #ccc;
        }

        /* زر الطلب (Order Now) */
        .order-button {
            display: inline-block;
            padding: 12px 40px;
            background: #ffc107; /* اللون البرتقالي/الأصفر */
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            transition: background 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
            cursor: pointer;
            text-transform: uppercase; /* لجعل النص أحرف كبيرة */
        }

        .order-button:hover {
            background: #ffdb58;
        }

        /* صورة المنتج في الخلفية */
        .burger-image-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            z-index: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .burger-image-container img {
            width: 100%;
            max-width: 500px;
            height: auto;
            object-fit: cover;
            transform: translateY(10%);
        }

        /* تدرج داكن في الأسفل لجعل النص واضحًا */
        .burger-image-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #000 5%, transparent 100%);
            z-index: 1;
        }
        
        /* نقاط التنقل السفلية */
        .dots-navigation {
            position: absolute;
            bottom: 20px;
            z-index: 5;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .dot.active {
            background-color: #ffc107;
        }

    </style>
</head>
<body>

    <section class="hero-section">
        <div class="overlay"></div>

        <div class="header">
            <div class="logo-container">
                <div class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="logo">م أ</div> 
            </div>
            
            <p style="font-size: 14px; margin: 0;">almafraa.restaurant.io</p>
        </div>

        <div class="burger-image-container">
            <img src="https://i.imgur.com/k6lP0Wn.png" alt="برغر لحم مع جبنة">
        </div>

        <div class="content">
            <h1 class="main-title">Almafraa Restaurant</h1>
            <p class="tagline">
                الجوع بيخلص هون... سناكك جاهز ع المفرق
            </p>
            <a href="#" class="order-button">Order Now</a>
        </div>
        
        <div class="dots-navigation">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
    </section>

</body>
</html>
